<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" style="width:100%;max-width:800px;height:auto;display:block;">
<rect width="800" height="520" fill="#f8fafc"/>
<defs>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
<marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4"/></marker>
</defs>
<text x="400" y="35" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">Pauly Deployment Flow</text>
<rect x="25.0" y="80" width="130" height="80" rx="8" fill="#3b82f620" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
<text x="90.0" y="125.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e293b" font-weight="bold">1. Clone</text>
<text x="90.0" y="142.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569" >git clone</text>
<text x="90.0" y="158.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" >Get the repo</text>
<line x1="155.0" y1="120.0" x2="180.0" y2="120.0" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<rect x="180.0" y="80" width="130" height="80" rx="8" fill="#14b8a620" stroke="#14b8a6" stroke-width="1.5" filter="url(#shadow)"/>
<text x="245.0" y="125.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e293b" font-weight="bold">2. Configure</text>
<text x="245.0" y="142.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569" >cp .env.example .env</text>
<text x="245.0" y="158.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" >Set variables</text>
<line x1="310.0" y1="120.0" x2="335.0" y2="120.0" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<rect x="335.0" y="80" width="130" height="80" rx="8" fill="#f9731620" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
<text x="400.0" y="125.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e293b" font-weight="bold">3. Detect Ports</text>
<text x="400.0" y="142.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569" >detect-ports.sh</text>
<text x="400.0" y="158.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" >Auto-find free ports</text>
<line x1="465.0" y1="120.0" x2="490.0" y2="120.0" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<rect x="490.0" y="80" width="130" height="80" rx="8" fill="#8b5cf620" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
<text x="555.0" y="125.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e293b" font-weight="bold">4. Deploy Directus</text>
<text x="555.0" y="142.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569" >docker compose up -d</text>
<text x="555.0" y="158.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" >CMS + DB + Cache</text>
<line x1="620.0" y1="120.0" x2="645.0" y2="120.0" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
<rect x="645.0" y="80" width="130" height="80" rx="8" fill="#10b98120" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
<text x="710.0" y="125.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e293b" font-weight="bold">5. Deploy Astro</text>
<text x="710.0" y="142.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569" >docker compose up -d</text>
<text x="710.0" y="158.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b" >Docs Frontend</text>
<text x="400" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#0f172a" font-weight="bold">Verification Checkpoints</text>
<rect x="60.0" y="230" width="200" height="50" rx="8" fill="#3b82f620" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
<text x="160.0" y="260.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e293b" font-weight="bold">Directus Health</text>
<text x="160.0" y="275.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569" >curl /server/health</text>
<path d="M 620.0 160 Q 620.0 160 620.0 280" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300.0" y="230" width="200" height="50" rx="8" fill="#8b5cf620" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
<text x="400.0" y="260.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e293b" font-weight="bold">Astro Health</text>
<text x="400.0" y="275.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569" >curl / (HTTP 200)</text>
<path d="M 775.0 160 Q 775.0 160 775.0 280" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="540.0" y="230" width="200" height="50" rx="8" fill="#10b98120" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
<text x="640.0" y="260.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1e293b" font-weight="bold">Optional: init.sh</text>
<text x="640.0" y="275.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#475569" >Full bootstrap</text>
<text x="400" y="365" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#0f172a" font-weight="bold">Post-Deployment: Optional Phases</text>
<rect x="14.0" y="385" width="100" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="64.0" y="406.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569" >Agent Config</text>
<rect x="126.0" y="385" width="100" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="176.0" y="406.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569" >Context Files</text>
<rect x="238.0" y="385" width="100" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="288.0" y="406.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569" >Triggers</text>
<rect x="350.0" y="385" width="100" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="400.0" y="406.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569" >MCP Servers</text>
<rect x="462.0" y="385" width="100" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="512.0" y="406.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569" >PA Dashboard</text>
<rect x="574.0" y="385" width="100" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="624.0" y="406.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569" >React Admin</text>
<rect x="686.0" y="385" width="100" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="736.0" y="406.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#475569" >Guardian</text>
<text x="400" y="495" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b" >bash optional/&lt;phase&gt;/scripts/install.sh (or: init.sh --skills for all)</text>
</svg>